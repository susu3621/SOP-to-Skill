name: Build Desktop Scaffold

on:
  push:
  workflow_dispatch:
    inputs:
      release_build:
        description: Create a signed release build
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify-web-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:skills
      - run: npm run test
      - run: npm run build

  build-desktop:
    needs: verify-web-shell
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_SIGNING_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_CONTENT != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: desktop-macos
            bundle_path: src-tauri/target/release/bundle/dmg/sop-to-skill-*.dmg
          - os: windows-latest
            artifact_name: desktop-windows
            bundle_path: src-tauri/target/release/sop-to-skill.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')
        name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for var in TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBLIC_KEY
          do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required updater signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - if: matrix.os == 'macos-latest' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && env.HAS_APPLE_SIGNING_SECRETS == 'true'
        name: Validate macOS signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          missing=()
          for var in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required macOS signing/notarization secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - if: matrix.os == 'macos-latest' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && env.HAS_APPLE_SIGNING_SECRETS == 'true'
        name: Write App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          cat > "$key_path" <<'EOF'
          ${{ secrets.APPLE_API_KEY_CONTENT }}
          EOF
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')
        name: Write release updater config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs')
          const configPath = 'src-tauri/tauri.release.conf.json'
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'))
          config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`)
          EOF
      - if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'windows-latest'
        name: Build release desktop bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: SOP to Skill v__VERSION__
          releaseBody: |
            Automated desktop release from `${{ github.ref_name }}` at `${{ github.sha }}`.
          releaseDraft: false
          prerelease: false
      - if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'macos-latest' && env.HAS_APPLE_SIGNING_SECRETS == 'true'
        name: Build release macOS desktop bundle with Apple signing
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: SOP to Skill v__VERSION__
          releaseBody: |
            Automated desktop release from `${{ github.ref_name }}` at `${{ github.sha }}`.
          releaseDraft: false
          prerelease: false
      - if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'macos-latest' && env.HAS_APPLE_SIGNING_SECRETS != 'true'
        name: Build release macOS desktop bundle with ad-hoc signing
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          tagName: v__VERSION__
          releaseName: SOP to Skill v__VERSION__
          releaseBody: |
            Automated desktop release from `${{ github.ref_name }}` at `${{ github.sha }}`.
          releaseDraft: false
          prerelease: false
      - if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'macos-latest'
        name: Upload macOS updater bundle assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          release_tag="v$version"
          arch="$(uname -m)"
          case "$arch" in
            arm64) arch='aarch64' ;;
            x86_64) arch='x86_64' ;;
          esac

          bundle_dir='src-tauri/target/release/bundle/macos'
          tarball="$bundle_dir/SOP-to-Skill.app.tar.gz"
          signature="$tarball.sig"
          test -f "$tarball"
          test -f "$signature"

          upload_dir="$RUNNER_TEMP/macos-updater-assets"
          mkdir -p "$upload_dir"
          release_tarball="$upload_dir/SOP-to-Skill_${version}_${arch}.app.tar.gz"
          release_signature="$upload_dir/SOP-to-Skill_${version}_${arch}.app.tar.gz.sig"
          cp "$tarball" "$release_tarball"
          cp "$signature" "$release_signature"

          gh release upload "$release_tag" "$release_tarball" "$release_signature" --clobber
      - if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build != 'true')) && !startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        name: Build macOS desktop bundle on push with ad-hoc signing
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
      - if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build != 'true')) && !startsWith(github.ref, 'refs/tags/v') && matrix.os != 'macos-latest'
        name: Build desktop bundle on push without release signing
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.os == 'macos-latest'
        name: Rename macOS DMG artifact to sop-to-skill slug
        shell: bash
        run: |
          set -euo pipefail
          dmg_dir='src-tauri/target/release/bundle/dmg'
          original="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "$original" ]; then
            echo 'No DMG found to rename' >&2
            exit 1
          fi

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="$(uname -m)"
          renamed="$dmg_dir/sop-to-skill-${version}-${arch}.dmg"
          mv "$original" "$renamed"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  publish-updater-manifest:
    needs: build-desktop
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Merge release updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          release_tag="v$version"
          workdir="$RUNNER_TEMP/updater-manifest"
          mkdir -p "$workdir"

          gh release download "$release_tag" -p latest.json -p 'SOP-to-Skill_*.app.tar.gz.sig' -D "$workdir"

          latest_path="$workdir/latest.json"
          mac_sig_path="$(find "$workdir" -maxdepth 1 -type f -name 'SOP-to-Skill_*.app.tar.gz.sig' | head -n 1)"
          if [ -z "$mac_sig_path" ]; then
            echo 'No macOS updater signature found in release assets' >&2
            exit 1
          fi

          mac_asset_name="$(basename "$mac_sig_path" .sig)"
          mac_arch="$(basename "$mac_sig_path" | sed -E 's/^SOP-to-Skill_[0-9]+\.[0-9]+\.[0-9]+_([^.]+)\.app\.tar\.gz\.sig$/\1/')"
          if [ -z "$mac_arch" ] || [ "$mac_arch" = "$(basename "$mac_sig_path")" ]; then
            echo "Failed to parse macOS updater architecture from $mac_sig_path" >&2
            exit 1
          fi
          case "$mac_arch" in
            aarch64) mac_target='darwin-aarch64' ;;
            x86_64) mac_target='darwin-x86_64' ;;
            *)
              echo "Unsupported macOS updater architecture: $mac_arch" >&2
              exit 1
              ;;
          esac

          export LATEST_PATH="$latest_path"
          export MAC_ASSET_NAME="$mac_asset_name"
          export MAC_SIGNATURE="$(tr -d '\r\n' < "$mac_sig_path")"
          export MAC_TARGET="$mac_target"
          export RELEASE_TAG="$release_tag"

          node <<'EOF'
          const fs = require('node:fs')

          const latest = JSON.parse(fs.readFileSync(process.env.LATEST_PATH, 'utf8'))
          const entry = {
            signature: process.env.MAC_SIGNATURE,
            url: `https://github.com/susu3621/SOP-to-Skill/releases/download/${process.env.RELEASE_TAG}/${process.env.MAC_ASSET_NAME}`,
          }

          latest.platforms ||= {}
          latest.platforms[process.env.MAC_TARGET] = entry
          latest.platforms[`${process.env.MAC_TARGET}-app`] = entry
          fs.writeFileSync(process.env.LATEST_PATH, `${JSON.stringify(latest, null, 2)}\n`)
          EOF

          gh release upload "$release_tag" "$latest_path" --clobber
