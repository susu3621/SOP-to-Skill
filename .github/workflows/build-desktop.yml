name: Build Desktop Scaffold

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

  build-desktop:
    needs: verify-web-shell
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: desktop-macos
            bundle_path: src-tauri/target/release/bundle/macos/desktop-macos.tar.gz
          - os: windows-latest
            artifact_name: desktop-windows
            bundle_path: src-tauri/target/release/bundle/nsis/**
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: false
      - if: matrix.os == 'macos-latest'
        name: Package macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          tar -C src-tauri/target/release/bundle/macos -czf src-tauri/target/release/bundle/macos/desktop-macos.tar.gz "$(basename "$app_path")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
