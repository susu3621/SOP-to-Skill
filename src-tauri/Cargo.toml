[package]
name = "skill-configurator"
version = "0.1.0"
description = "Desktop scaffold for guided skill configuration"
authors = ["OpenAI Codex"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "skill_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
handlebars = "5"
dirs = "5"
shellexpand = "3"
octocrab = "0.42"
semver = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
