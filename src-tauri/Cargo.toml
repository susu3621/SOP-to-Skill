[package]
name = "skill-configurator"
version = "0.1.0"
description = "Desktop scaffold for guided skill configuration"
authors = ["OpenAI Codex"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "skill_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
